name: Turni
options:
  developmentLanguage: it
  deploymentTarget:
    iOS: "17.0"
targets:
  Turni:
    type: application
    platform: iOS
    sources: [Turni, Shared]
    dependencies:
      - target: TurniWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tuonome.turni
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Config/Turni.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Turni
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Serve per leggere i turni che Dayforce copia nel calendario"
        INFOPLIST_KEY_NSCalendarsUsageDescription: "Serve per leggere i turni che Dayforce copia nel calendario"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.3"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TurniWidget:
    type: app-extension
    platform: iOS
    sources: [TurniWidget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tuonome.turni.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/TurniWidget-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Turni
        CODE_SIGN_ENTITLEMENTS: Config/Turni.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.3"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
  TurniUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TurniUITests]
    dependencies:
      - target: Turni
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tuonome.turni.uitests
        TEST_TARGET_NAME: Turni
        SWIFT_VERSION: "5.0"
  TurniTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TurniTests]
    dependencies:
      - target: Turni
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tuonome.turni.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Turni.app/Turni"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "5.0"
schemes:
  Turni:
    build:
      targets:
        Turni: all
        TurniTests: [test]
        TurniUITests: [test]
    test:
      targets: [TurniTests, TurniUITests]
